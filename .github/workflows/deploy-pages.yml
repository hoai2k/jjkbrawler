name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # QUEUE, do not cancel. `true` is the usual advice and it is wrong for a repo
  # this busy: several sessions push to main within minutes of each other, and
  # every push cancelled the deploy that was still running. On 2026-08-10 that
  # starved the site for four commits in a row — the last SUCCESSFUL publish was
  # 40 minutes and five pushes behind main, so a change that had been merged,
  # checked and pushed was simply not on the site, and no amount of reloading
  # was going to find it.
  #
  # Queued runs cost a little runner time and publish in order, last one wins.
  # A deploy that is slower is still a deploy; a deploy that is cancelled is not.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The game is plain HTML/CSS/JS with no build step, so the repo
      # root is published as-is. .nojekyll keeps Pages from filtering files.
      - name: Prepare artifact
        run: touch .nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
