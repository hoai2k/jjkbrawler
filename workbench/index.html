<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sprite Workbench — JJK Brawler II</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="workbench.css">
  </head>
  <body>
    <header class="bar">
      <strong id="wbTitle">Sprite Workbench</strong>
      <span class="hint">Renders through the game's own sprite pipeline — what you see is what the game draws.</span>
      <nav class="modes">
        <a id="modeSprites" href="./">Sprites</a>
        <a id="modeActions" href="./?edit=actions">Actions</a>
      </nav>
      <span class="history">
        <button id="undoBtn" class="ghost sm" title="Undo (Cmd/Ctrl+Z)">↶ Undo</button>
        <button id="redoBtn" class="ghost sm" title="Redo (Cmd/Ctrl+Shift+Z)">↷ Redo</button>
      </span>
      <span id="loadState" class="loading">loading assets…</span>
    </header>

    <main id="actionsView" hidden></main>

    <main class="layout" id="spriteView">
      <!-- ---------------------------------------------------------- stage -->
      <section class="stage-col">
        <div class="stage-wrap">
          <canvas id="stage" width="760" height="620"></canvas>
          <div id="frameTag" class="frame-tag">—</div>
        </div>

        <div class="row">
          <div class="group grow">
            <label>Viewer zoom <span class="sub" id="zoomVal">1.9×</span></label>
            <input type="range" id="zoomRange" min="0.6" max="5" step="0.05" value="1.9">
          </div>
          <div class="group">
            <label>Background</label>
            <div id="bgSwatches" class="swatches"></div>
          </div>
        </div>

        <div class="group" id="referenceGroup">
          <label data-help="The two references answer different questions. The character&apos;s own idle is &lt;em&gt;overlaid&lt;/em&gt;, for lining a pose up within one sprite set. Gojo stands at the left end of the platform instead, so size reads against the rest of the roster the way it does in a real match.&lt;br&gt;&lt;br&gt;Spin preview rotates the pose about its centre of mass, exactly as the game does for tumbles, rolls and leans — an anchor in the wrong place makes the body orbit instead of turn.">Reference overlays</label>
          <div class="chips">
            <label class="chip"><input type="checkbox" id="refSelf"> This character's idle (overlaid)</label>
            <label class="chip"><input type="checkbox" id="refGojo"> Gojo idle (size benchmark, stands aside)</label>
            <label class="chip"><input type="checkbox" id="showPlatform" checked> Game platform</label>
            <label class="chip"><input type="checkbox" id="showGuides" checked> Guides</label>
            <label class="chip"><input type="checkbox" id="showBox"> Sprite bounds</label>
            <label class="chip"><input type="checkbox" id="spinPreview"> Spin preview</label>
          </div>
        </div>
      </section>

      <!-- --------------------------------------------------------- panel -->
      <section class="panel">
        <div class="group">
          <label for="charSel">Character</label>
          <select id="charSel"></select>
        </div>

        <div class="group">
          <label data-help="These filter on what is &lt;b&gt;saved in the codebase&lt;/b&gt;, not on what you have done since the page loaded.&lt;br&gt;&lt;br&gt;&lt;b&gt;No saved edits&lt;/b&gt; is the working view: poses the game draws that nobody has committed an adjustment for yet — a to-do list. Editing one does &lt;em&gt;not&lt;/em&gt; remove it from this list; it moves only once your export has been applied and the page reloaded.&lt;br&gt;&lt;br&gt;&lt;b&gt;Has saved edits&lt;/b&gt; is the other half, &lt;b&gt;Used in game&lt;/b&gt; drops the filter entirely, and &lt;b&gt;All&lt;/b&gt; adds the sheet cells the game never draws.&lt;br&gt;&lt;br&gt;The yellow dot is the separate question: what you have changed this session and not exported yet. A flagged pose is marked separately again.">Pose <span class="sub" id="poseCount"></span></label>
          <select id="viewSel"></select>
          <div id="poseList" class="pose-list"></div>
        </div>

        <div class="group">
          <label data-help="Marks this pose&apos;s &lt;em&gt;art&lt;/em&gt; as wrong, as opposed to its placement being wrong — the placement controls fix that.&lt;br&gt;&lt;br&gt;The dropdown says &lt;em&gt;what&lt;/em&gt; is wrong, because a wholesale redraw and a crop fix are very different asks: &lt;b&gt;Replace&lt;/b&gt; redraws the sprite, &lt;b&gt;Fix crop&lt;/b&gt; is wrong framing or bounds, &lt;b&gt;Fix alpha&lt;/b&gt; is bad transparency, &lt;b&gt;Fix bleed&lt;/b&gt; is colour past the silhouette.&lt;br&gt;&lt;br&gt;It exports with everything else; the flagged poses are then collected into the asset request list, and clearing happens automatically when the new art is imported.">Artwork <span class="sub" id="replaceVal"></span></label>
          <div class="chips">
            <label class="chip"><input type="checkbox" id="replaceBox"> Sprite needs replacement</label>
          </div>
          <select id="replaceKind" hidden></select>
        </div>

        <div class="group">
          <label data-help="A softer ask than a replacement: the art &lt;em&gt;works&lt;/em&gt;, it is just not as good as it should be. Collected at a lower priority, because nothing is blocked.&lt;br&gt;&lt;br&gt;&lt;b&gt;Quality&lt;/b&gt; is a rough or sloppily executed drawing, &lt;b&gt;Pose&lt;/b&gt; is art that reads poorly or is not the action it stands for, &lt;b&gt;Character&lt;/b&gt; is a likeness or costume that is off.&lt;br&gt;&lt;br&gt;Independent of the replacement flag — a pose can be flagged for both, though if it needs replacing outright there is little point asking for it to be improved as well.">Improvement <span class="sub" id="improveVal"></span></label>
          <div class="chips">
            <label class="chip"><input type="checkbox" id="improveBox"> Request improvement</label>
          </div>
          <select id="improveKind" hidden></select>
        </div>

        <div class="group" id="mirrorGroup">
          <label data-help="The canvas shows the direction the game draws, facing right. The sheets are drawn facing right too, so a pose the artist drew facing &lt;em&gt;left&lt;/em&gt; needs mirroring — tick this and it will face the way the fighter is moving in a match.">Facing <span class="sub" id="mirrorVal"></span></label>
          <div class="chips">
            <label class="chip"><input type="checkbox" id="mirrorBox"> Mirror this pose</label>
          </div>
        </div>

        <!-- Placement sits ABOVE the anchors: it is what a pass through a
             character actually touches on every pose, so it should not be
             below a box whose height varies with how many anchors a pose has.
             Each slider is paired with the number it sets, which is editable —
             a value read off one pose can be typed into the next. -->
        <div class="group" id="usageGroup" hidden>
          <label data-help="These sprites are not part of any character&apos;s sheet: they are the shared &lt;code&gt;effect:&lt;/code&gt; and &lt;code&gt;summon:&lt;/code&gt; art the game draws for techniques, shikigami and stage props.&lt;br&gt;&lt;br&gt;They carry no per-frame placement data — the code that spawns each one decides its size and position — so the placement controls do not apply and are hidden. What you can do here is look at them at their in-game size and flag the ones that need redrawing.">Where it is used</label>
          <div id="usageInfo" class="note"></div>
        </div>

        <div class="group" id="scaleGroup">
          <label>Size <span class="sub" id="scaleVal"></span></label>
          <div class="slider-row">
            <input type="range" id="scaleRange" min="0.4" max="2.2" step="0.005" value="1">
            <input type="number" id="scaleNum" class="num" step="0.1" inputmode="decimal" aria-label="Size, percent of delivered">
            <span class="unit">%</span>
          </div>
        </div>

        <div class="group" id="offsetGroup">
          <label>Horizontal position <span class="sub" id="offsetVal"></span></label>
          <div class="slider-row">
            <input type="range" id="offsetRange" min="-120" max="120" step="0.5" value="0">
            <input type="number" id="offsetNum" class="num" step="0.5" inputmode="decimal" aria-label="Horizontal position, pixels">
            <span class="unit">px</span>
          </div>
        </div>

        <div class="group" id="groundGroup">
          <label data-help="Sets where the sprite meets the floor. Defaults to the lowest opaque pixel, which is wrong when perspective puts one foot lower than the standing plane — raise it so the &lt;em&gt;near&lt;/em&gt; foot rests on the platform.&lt;br&gt;&lt;br&gt;A pose only ever drawn in the air has no floor contact to set, so the control locks. The ground line stays on screen as a size reference against the idle.">Ground contact <span class="sub" id="groundVal"></span></label>
          <div class="slider-row">
            <input type="range" id="groundRange" min="-120" max="120" step="0.5" value="0">
            <input type="number" id="groundNum" class="num" step="0.5" inputmode="decimal" aria-label="Ground contact, pixels">
            <span class="unit">px</span>
          </div>
        </div>

        <div class="group" id="anchorGroup">
          <label id="anchorLabel">Anchors</label>
          <div id="anchorRows"></div>
        </div>

        <div class="group" id="heightGroup">
          <label data-help="The fighter&apos;s &lt;em&gt;global&lt;/em&gt; size: every pose is drawn at a scale solved from this, so moving it resizes the whole sprite set at once. The bar on the canvas is where the top of the head lands.&lt;br&gt;&lt;br&gt;Defaults to the character&apos;s canon height (&lt;code&gt;heightCm&lt;/code&gt; in characters.js), compressed toward Gojo so the roster keeps its real ordering without outgrowing the shared hurtbox. Fighters with no published height sit at Gojo&apos;s. Reset returns to the canon-derived value.">Character height <span class="sub" id="headVal"></span></label>
          <input type="range" id="headRange" min="110" max="240" step="0.5" value="175">
          <div class="nudge">
            <button data-head="-5">↓5</button>
            <button data-head="-1">↓1</button>
            <button data-head="1">↑1</button>
            <button data-head="5">↑5</button>
          </div>
          <button id="resetHead" class="ghost">Reset to canon height</button>
        </div>

        <div class="group" id="secondaryGroup">
          <label data-help="The 17 original fighters came from 4×5 sprite &lt;em&gt;sheets&lt;/em&gt;, so one cell often has to serve several actions at once — Maki&apos;s sprint cell is her dash, her dodge, her jab and her neutral special.&lt;br&gt;&lt;br&gt;The pose list names each cell after the action it was drawn as. This section lists the &lt;b&gt;other&lt;/b&gt; actions — the ones borrowing a sprite that belongs to something else — and lets you point each at a different sprite, including the unused cells the sheets left over.&lt;br&gt;&lt;br&gt;A change here is a &lt;em&gt;mapping&lt;/em&gt;, not art: it exports alongside the pose adjustments and is applied to the manifest, so characters.js does not have to change. ↺ puts an action back to the sprite the kit gives it.">Secondary actions <span class="sub" id="secondaryCount"></span></label>
          <div id="actionRows" class="action-rows"></div>
        </div>

        <div class="group" id="resetGroup">
          <button id="resetFrame" class="ghost">Reset this pose</button>
          <button id="resetChar" class="ghost">Reset character</button>
        </div>

        <div class="group">
          <label>Changes <span class="sub" id="dirtyCount">none</span></label>
          <button id="exportBtn" class="primary">Export all adjustments (downloads a file)</button>
          <textarea id="exportOut" rows="9" spellcheck="false"
                    placeholder="Adjust poses on any number of characters, then press Export once. The JSON downloads as a file and is also shown here to read or copy."></textarea>
          <button id="copyBtn" class="ghost">Copy to clipboard</button>
        </div>
      </section>
    </main>

    <!-- Two workbenches share this shell: the sprite editor (default) and the
         action player (?edit=actions). Only the requested one is kept in the
         DOM, so each module owns its ids outright. -->
    <script type="module">
      const params = new URLSearchParams(location.search);
      const char = params.get("char");
      const suffix = char ? `&char=${encodeURIComponent(char)}` : "";
      document.getElementById("modeSprites").href = `./${char ? `?char=${encodeURIComponent(char)}` : ""}`;
      document.getElementById("modeActions").href = `./?edit=actions${suffix}`;

      if (params.get("edit") === "actions") {
        document.getElementById("spriteView").remove();
        document.querySelector(".history").remove();
        document.getElementById("actionsView").hidden = false;
        document.getElementById("wbTitle").textContent = "Action Workbench";
        document.querySelector(".hint").textContent =
          "Play any action through the game's own animation data, then jump to the sprites it uses.";
        document.title = "Action Workbench — JJK Brawler II";
        document.getElementById("modeActions").classList.add("on");
        import("./actions.js");
      } else {
        document.getElementById("actionsView").remove();
        document.getElementById("modeSprites").classList.add("on");
        import("./workbench.js");
      }
    </script>
  </body>
</html>
